apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

apply from: 'git-info.gradle'

android {
    compileSdkVersion setup.compileSdk

    namespace = 'eu.mikus.edziennik'

    defaultConfig {
        applicationId 'eu.mikus.edziennik'
        minSdkVersion setup.minSdk
        targetSdkVersion setup.targetSdk

        versionCode release.versionCode
        versionName "${release.versionName}-${gitInfo.versionSuffix}"

        buildConfigField "java.util.Map<String, String>", "GIT_INFO", gitInfoMap
        buildConfigField "String", "VERSION_BASE", "\"${release.versionName}\""
        buildConfigField "String", "FLAVOR", "\"main\""
        manifestPlaceholders = [
                buildTimestamp: String.valueOf(System.currentTimeMillis())
        ]

        multiDexEnabled = true
        vectorDrawables.useSupportLibrary = true

        kapt {
            arguments {
                arg("room.schemaLocation", "$projectDir/schemas")
            }
        }
    }

    buildTypes {
        debug {
            getIsDefault().set(true)
            minifyEnabled = false
            manifestPlaceholders = [
                    buildTimestamp: 0
            ]
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            proguardFiles fileTree('proguard').asList().toArray()
        }
    }
    buildFeatures {
        buildConfig = true
        dataBinding = true
        viewBinding = true
        compose = true
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/library-core_release.kotlin_module']
        }
    }
    lint {
        checkReleaseBuilds = false
        // Polish is the canonical source language; en/de translations are partial
        // and added over time. See CLAUDE.md "Strings" section.
        disable 'MissingTranslation'
    }
    testOptions {
        unitTests {
            // Robolectric needs Android resources accessible on the test classpath.
            includeAndroidResources = true
            // Un-mocked Android-framework calls return defaults instead of throwing
            // (helps when a touched class incidentally pokes android.* APIs).
            returnDefaultValues = true

            all {
                // Run the JUnit Platform — Jupiter (JUnit 5) is the default engine.
                // The Vintage engine is also on the classpath so Robolectric's
                // @RunWith(RobolectricTestRunner.class) JUnit 4 tests still run.
                useJUnitPlatform()
                jvmArgs '-Djdk.attach.allowAttachSelf=true', '-XX:+EnableDynamicAgentLoading', '-Xshare:off'
            }
        }
    }
}

kotlin {
    jvmToolchain(17)
}

tasks.whenTaskAdded { task ->
    if (!(task.name == "assembleRelease" || task.name == "bundleRelease" || task.name == "signReleaseBundle"))
        return

    def renameTaskName = "rename${task.name.capitalize()}"

    tasks.register(renameTaskName, Copy) {
        dependsOn(task.name)
        duplicatesStrategy = DuplicatesStrategy.FAIL
        from file("${projectDir}/release/"),
                file("${projectDir}/build/outputs/apk/release/"),
                file("${projectDir}/build/outputs/mapping/release/"),
                file("${projectDir}/build/outputs/bundle/release/")
        include "*-release.aab", "*-release.apk", "mapping.txt", "output-metadata.json"
        destinationDir = file("${projectDir}/release/")
        rename ".+?\\.(.+)", "Edziennik_${android.defaultConfig.versionName}." + '$1'
    }

    task.finalizedBy(renameTaskName)
}

configurations.all {
    // kotlin-android-extensions was replaced by kotlin-parcelize; some transitive
    // libraries still pull in the old runtime and produce duplicate kotlinx.android.parcel.* classes.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Language cores
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    // Android Jetpack
    implementation "androidx.appcompat:appcompat:1.5.1"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.navigation:navigation-fragment-ktx:2.9.5"
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.room:room-runtime:2.4.3"
    implementation "androidx.room:room-ktx:2.4.3"
    implementation "androidx.work:work-runtime-ktx:2.7.1"
    kapt "androidx.room:room-compiler:2.4.3"

    // Google design libs
    implementation "com.google.android.material:material:1.6.1"
    implementation "com.google.android.flexbox:flexbox:3.0.0"

    // Jetpack Compose — Material 3 foundation (Phase 0). Stable material3 (no Expressive yet).
    implementation platform("androidx.compose:compose-bom:2026.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    debugImplementation "androidx.compose.ui:ui-tooling"
    // Compose calendar (Phase 7 Agenda) — replaces the legacy Applandeo Material-Calendar-View.
    // (agendacalendarview stays: still used by NoteManager's DayDialog day-popup.)
    implementation "com.kizitonwose.calendar:compose:2.10.1"
    // Compose drag-and-drop reorderable list (Phase 8 Home dashboard cards).
    implementation "sh.calvin.reorderable:reorderable:2.4.3"

    // Play Services
    implementation "com.google.android.gms:play-services-wearable:17.1.0"

    // OkHttp, Retrofit, Gson, Jsoup
    implementation("com.squareup.okhttp3:okhttp") { version { strictly "3.12.13" } }
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.retrofit2:converter-scalars:2.9.0"
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'org.jsoup:jsoup:1.14.3'
    implementation "pl.droidsonroids:jspoon:1.3.2"
    implementation "pl.droidsonroids.retrofit2:converter-jspoon:1.3.2"

    // Szkolny.eu libraries/forks
    implementation "eu.szkolny:android-snowfall:1ca9ea2da3"
    implementation "eu.szkolny:agendacalendarview:1.0.4"
    implementation "eu.szkolny:cafebar:5bf0c618de"
    implementation "eu.szkolny.fslogin:lib:2.0.0"
    implementation "eu.szkolny:material-about-library:1d5ebaf47c"
    implementation "eu.szkolny:mhttp:af4b62e6e9"
    implementation "eu.szkolny:nachos:0e5dfcaceb"
    implementation "eu.szkolny.selective-dao:annotation:27f8f3f194"
    implementation "eu.szkolny:ssl-provider:1.0.0"
    implementation "pl.szczodrzynski:navlib:0.8.0"
    implementation "pl.szczodrzynski:numberslidingpicker:2921225f76"
    implementation "pl.szczodrzynski:recyclertablayout:700f980584"
    kapt "eu.szkolny.selective-dao:codegen:27f8f3f194"

    // Iconics & related
    implementation "com.mikepenz:iconics-core:5.3.2"
    implementation "com.mikepenz:iconics-views:5.3.2"
    implementation "com.mikepenz:community-material-typeface:5.8.55.0-kotlin@aar"
    implementation "eu.szkolny:szkolny-font:77e33acc2a"

    // Other dependencies
    implementation "cat.ereza:customactivityoncrash:2.3.0"
    implementation "com.android.volley:volley:1.2.1"
    implementation "com.daimajia.swipelayout:library:1.2.0@aar"
    implementation "com.github.CanHub:Android-Image-Cropper:2.2.2" // https://github.com/CanHub/Android-Image-Cropper
    implementation "com.github.ChuckerTeam.Chucker:library:3.5.2" // https://github.com/ChuckerTeam/chucker
    implementation "com.github.antonKozyriatskyi:CircularProgressIndicator:1.2.2" // https://github.com/antonKozyriatskyi/CircularProgressIndicator
    implementation "com.github.bassaer:chatmessageview:2.0.1" // https://github.com/bassaer/ChatMessageView
    implementation "com.github.hypertrack:hyperlog-android:0.0.10" // https://github.com/hypertrack/hyperlog-android
    implementation "com.github.smuyyh:JsonViewer:V1.0.6" // https://github.com/smuyyh/JsonViewer
    implementation "com.github.underwindfall.PowerPermission:powerpermission-coroutines:1.4.0" // https://github.com/underwindfall/PowerPermission
    implementation "com.github.underwindfall.PowerPermission:powerpermission:1.4.0" // https://github.com/underwindfall/PowerPermission
    implementation "com.jaredrummler:colorpicker:1.1.0"
    implementation "io.coil-kt:coil:1.1.1"
    implementation "me.dm7.barcodescanner:zxing:1.9.8"
    implementation "me.grantland:autofittextview:0.2.1"
    implementation "me.leolin:ShortcutBadger:1.1.22@aar"
    implementation "org.greenrobot:eventbus:3.2.0"
    implementation("com.heinrichreimersoftware:material-intro") { version { strictly "1.5.8" } }
    implementation("pl.droidsonroids.gif:android-gif-drawable") { version { strictly "1.2.15" } }

    // Debug-only dependencies
    debugImplementation "com.github.amitshekhariitbhu.Android-Debug-Database:debug-db:v1.0.6"

    // JVM unit tests (app/src/test/). The default engine is JUnit Jupiter (JUnit 5)
    // via the JUnit Platform — see android.testOptions.unitTests.all { useJUnitPlatform() }.
    // The Vintage engine is also on the classpath so Robolectric (which currently
    // ships only a JUnit 4 runner) can run side-by-side with Jupiter tests.
    // For tests that need a real Android runtime, use Robolectric + androidx.test.

    // JUnit 5 (Jupiter) via BOM — keeps Jupiter / Platform / Vintage versions aligned.
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Vintage engine — runs JUnit 4 tests (Robolectric) under the JUnit Platform.
    testRuntimeOnly "org.junit.vintage:junit-vintage-engine"
    // Robolectric still needs the JUnit 4 API at compile time for @RunWith.
    testImplementation "junit:junit:4.13.2"

    // Kotlin test helpers — assertEquals / assertNotNull / assertTrue that work
    // with both engines.
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5"
    // Matches the transitive kotlinx-coroutines-core version — keep these
    // pinned together; mismatched coroutines-test breaks runBlocking semantics.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"

    // Kotlin-friendly mocking.
    testImplementation "io.mockk:mockk:1.13.13"

    // Robolectric — Android framework fakes on the JVM. 4.14.1 is the first stable
    // release with Android 14 / 15 (SDK 35) support. We do NOT depend on
    // androidx.test:core or androidx.test.ext:junit: both ship AndroidManifest.xml
    // files with uses-sdk:minSdkVersion="19" which fail manifest-merger against the
    // app's production minSdk=16. Use Robolectric's RuntimeEnvironment.getApplication()
    // in place of ApplicationProvider.getApplicationContext(). Revisit if/when
    // we raise minSdk or need fragment/activity test scaffolds.
    testImplementation "org.robolectric:robolectric:4.14.1"

    // Compose UI tests run under Robolectric in app/src/test (no androidTest, no emulator).
    testImplementation "androidx.compose.ui:ui-test-junit4"
    testImplementation "androidx.compose.ui:ui-test-manifest"
}
